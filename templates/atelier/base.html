{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee8"><meta name="description" content="RUHAMAH — contemporary womenswear shaped by craftsmanship, individuality and timeless elegance.">
  <title>{% block title %}RUHAMAH — Elegance in Every Detail{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'atelier/css/site.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="side-rail" aria-label="Brand"><a href="{% url 'home' %}" class="rail-logo"><img src="/static/atelier/images/ruhamah-brand-logo.png" alt="Ruhamah Wears brand logo"></a><span class="rail-rule"></span><span class="rail-note">CONTEMPORARY WOMENSWEAR</span><span class="rail-index">LAGOS · EST. WITH INTENTION</span></aside>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="{% url 'home' %}" aria-label="Ruhamah Wears home"><img src="/static/atelier/images/ruhamah-brand-logo.png" alt="Ruhamah Wears"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span></span><span></span><span class="sr-only">Toggle navigation</span></button>
      <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
        <a href="{% url 'home' %}">Home</a><a href="{% url 'collections' %}">Collections</a><a href="{% url 'story' %}">Our story</a><a href="{% url 'bespoke' %}">Bespoke</a><a href="{% url 'contact' %}">Contact</a>
      </nav><span class="header-edition">A HOUSE OF QUIET CONFIDENCE</span>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
    {% include 'atelier/partials/footer.html' %}
  </div>
  <dialog class="lightbox" aria-label="Lookbook image"><button class="lightbox-close" aria-label="Close image">×</button><img alt=""><p></p></dialog>
  <script src="{% static 'atelier/js/site.js' %}" defer></script>
</body></html>
