{% load static %}<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee8">

  <title>{% block title %}RUHAMAH — Elegance in Every Detail{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}RUHAMAH — contemporary womenswear shaped by craftsmanship, individuality and timeless elegance. Lagos · Est. with intention.{% endblock %}">
  <meta name="keywords" content="RUHAMAH, contemporary womenswear, Nigerian fashion, bespoke tailoring, Lagos fashion designer, corporate wear, African heritage fashion">
  <meta name="author" content="Juliet Akoh, RUHAMAH">
  <meta name="robots" content="index, follow">

  <!-- Canonical URL -->
  <link rel="canonical" href="{% if request.build_absolute_uri %}{{ request.build_absolute_uri }}{% else %}https://ruhamah-wear.vercel.app/{% endif %}">

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RUHAMAH">
  <meta property="og:locale" content="en_GB">
  <meta property="og:title" content="{% block og_title %}RUHAMAH — Contemporary Womenswear | Elegance in Every Detail{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Discover contemporary womenswear shaped by craftsmanship, individuality and timeless elegance. Bespoke tailoring, corporate edits, and cultural heritage designs from Lagos.{% endblock %}">
  <meta property="og:url" content="{% if request.build_absolute_uri %}{{ request.build_absolute_uri }}{% else %}https://ruhamah-wear.vercel.app/{% endif %}">
  <meta property="og:image" content="{% block og_image %}{% if request.scheme %}{{ request.scheme }}://{{ request.get_host }}{% else %}https://ruhamah-wear.vercel.app{% endif %}{% static 'atelier/images/og-image.jpg' %}{% endblock %}">
  <meta property="og:image:secure_url" content="{% block og_image_secure %}{% if request.scheme %}{{ request.scheme }}://{{ request.get_host }}{% else %}https://ruhamah-wear.vercel.app{% endif %}{% static 'atelier/images/og-image.jpg' %}{% endblock %}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{% block og_image_alt %}RUHAMAH Contemporary Womenswear Editorial{% endblock %}">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}RUHAMAH — Contemporary Womenswear | Elegance in Every Detail{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Discover contemporary womenswear shaped by craftsmanship, individuality and timeless elegance. Bespoke tailoring, corporate edits, and cultural heritage designs from Lagos.{% endblock %}">
  <meta name="twitter:image" content="{% block twitter_image %}{% if request.scheme %}{{ request.scheme }}://{{ request.get_host }}{% else %}https://ruhamah-wear.vercel.app{% endif %}{% static 'atelier/images/og-image.jpg' %}{% endblock %}">
  <meta name="twitter:image:alt" content="{% block twitter_image_alt %}RUHAMAH Contemporary Womenswear Editorial{% endblock %}">

  <!-- Favicons and Brand Icons -->
  <link rel="icon" type="image/png" href="{% static 'atelier/images/ruhamah-brand-logo.png' %}">
  <link rel="apple-touch-icon" href="{% static 'atelier/images/ruhamah-brand-logo.png' %}">

  <!-- Typography & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'atelier/css/site.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <aside class="side-rail" aria-label="Brand"><a href="{% url 'home' %}" class="rail-logo"><img src="/static/atelier/images/ruhamah-brand-logo.png" alt="Ruhamah Wears brand logo"></a><span class="rail-rule"></span><span class="rail-note">CONTEMPORARY WOMENSWEAR</span><span class="rail-index">LAGOS · EST. WITH INTENTION</span></aside>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="{% url 'home' %}" aria-label="Ruhamah Wears home"><img src="/static/atelier/images/ruhamah-brand-logo.png" alt="Ruhamah Wears"></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span></span><span></span><span class="sr-only">Toggle navigation</span></button>
      <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
        <a href="{% url 'home' %}">Home</a><a href="{% url 'collections' %}">Collections</a><a href="{% url 'story' %}">Our story</a><a href="{% url 'bespoke' %}">Bespoke</a><a href="{% url 'contact' %}">Contact</a>
      </nav><span class="header-edition">A HOUSE OF QUIET CONFIDENCE</span>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
    {% include 'atelier/partials/footer.html' %}
  </div>
  <dialog class="lightbox" aria-label="Lookbook image"><button class="lightbox-close" aria-label="Close image">×</button><img alt=""><p></p></dialog>
  <script src="{% static 'atelier/js/site.js' %}" defer></script>
</body></html>
